name: nakatomi-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .local/postgres.env
    volumes:
      - local_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakatomi -d nakatomi"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .local/app.env
    volumes:
      - local_files:/app/data
      - ../lairot-arm-local/.data/mcp-bridge-key:/run/secrets/pulse-key:ro
    ports:
      - "127.0.0.1:4330:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  local_pg:
  local_files:
